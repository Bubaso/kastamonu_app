<!DOCTYPE html>
<html lang="tr">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">

  <!-- iOS meta tags & icons -->
  <meta name="theme-color" content="#FFFFFF">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kastamonu Haber">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- SOCIAL_META_START -->
  <title>Kastamonu Haber</title>
  <meta name="description" content="Kastamonu ve ilçeleriyle ilgili haberler.">
  <!-- SOCIAL_META_END -->
  <link rel="manifest" href="manifest.json">

  <!--
    Açılış kabuğunun görünümü.

    Neden burada
    ────────────
    CanvasKit inene kadar — ölçümde yaklaşık bir saniye — ekranda bir
    şey durmak zorunda. Eskiden orada sunucunun bastığı haber LİSTESİ
    duruyordu: stilsiz, madde imli, mavi altı çizili. Okur siteyi her
    açtığında önce bozuk bir sayfa görüyordu.

    Listeyi stillendirmek çözüm değildi: o liste okunacak bir sayfa
    değil, bekleme ekranı. Gizlemek de değildi — gizli metin arama
    motoru açısından riskli.

    Ana sayfa artık liste basmıyor (bkz. `functions/index.js`). Haber
    listesi makineye JSON-LD `ItemList` olarak veriliyor; keşif
    sitemap.xml ve kategori sayfalarının iç bağlantılarında.

    Ekranda duran şey uygulamanın KENDİ BAŞLIĞININ durağan kopyası:
    aynı ad, aynı bölüm çubuğu, aynı renkler. Flutter açılınca aynı
    başlık tuvalde çiziliyor, dolayısıyla geçiş göze çarpmıyor.

    Haber ve kategori sayfaları gövdelerini basmayı SÜRDÜRÜYOR: orada
    görünen şey sayfanın kendi içeriği, yani bekleme ekranı değil.

    Sistem yazı tipleri bilerek: uygulamanın fontlarını buraya çağırmak
    CanvasKit'le yarışan iki font indirmesi daha demek.
  -->
  <style>
    :root {
      --zemin: #FAF7F2;
      --kart: #FFFFFF;
      --murekkep: #14120F;
      --solgun: #6B6259;
      --cizgi: #DDD5C8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --zemin: #14120F;
        --kart: #1A1713;
        --murekkep: #F3EFE8;
        --solgun: #9C9286;
        --cizgi: #2A241D;
      }
    }
    html, body { margin: 0; padding: 0; background: var(--zemin); }

    /* ── Ana sayfa: uygulamanın başlığının kopyası ── */
    #ssr .kabuk {
      background: var(--kart);
      border-bottom: 1px solid var(--cizgi);
      padding: 0 18px;
    }
    #ssr .kabuk-ad {
      max-width: 1080px;
      margin: 0 auto;
      padding: 22px 0 18px;
      color: var(--murekkep);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 25px;
      font-weight: 700;
      letter-spacing: -.01em;
    }
    #ssr .kabuk-bolumler {
      max-width: 1080px;
      margin: 0 auto;
      padding-bottom: 13px;
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      overflow: hidden;
      max-height: 22px;
    }
    #ssr .kabuk-bolumler a {
      color: var(--solgun);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      text-decoration: none;
      white-space: nowrap;
    }

    /* ── Haber ve kategori sayfaları: sayfanın kendi içeriği ── */
    #ssr > h1, #ssr > p, #ssr > ul, #ssr > article {
      max-width: 1080px;
      margin-left: auto;
      margin-right: auto;
      padding-left: 18px;
      padding-right: 18px;
      box-sizing: border-box;
      color: var(--murekkep);
      font-family: Georgia, "Times New Roman", serif;
    }
    #ssr > h1 { padding-top: 24px; font-size: 27px; margin: 0 auto 10px; }
    #ssr > p {
      color: var(--solgun);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 13.5px;
      line-height: 1.5;
      margin: 0 auto 16px;
    }
    #ssr ul { list-style: none; margin: 0 auto; padding-left: 18px; padding-right: 18px; }
    /* Kategori sayfasında her madde "başlık — spot" biçiminde. Çizgi
       maddeyi ayırıyor, spotun altını çizmiyor. */
    #ssr li {
      border-bottom: 1px solid var(--cizgi);
      padding: 13px 0;
      color: var(--solgun);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }
    #ssr li a {
      display: block;
      margin-bottom: 4px;
      color: var(--murekkep);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      line-height: 1.3;
      text-decoration: none;
    }
    #ssr article h1 { font-size: 27px; margin: 0 0 12px; }
    #ssr article p { margin: 0 0 14px; font-size: 17px; line-height: 1.6; }
    #ssr img { max-width: 100%; height: auto; }

    /* Flutter çizmeye başlayınca kabuk kalkıyor. */
    body.hazir #ssr { display: none; }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Flutter görünümü DOM'a düştüğünde yedeği gizle. `flutter-view`
    // öğesi ilk kare çizilmeden hemen önce ekleniyor.
    (function () {
      var g = document.documentElement;
      function bitir() { document.body.classList.add("hazir"); }
      if (document.querySelector("flutter-view")) return bitir();
      var gozcu = new MutationObserver(function () {
        if (document.querySelector("flutter-view")) { gozcu.disconnect(); bitir(); }
      });
      gozcu.observe(g, { childList: true, subtree: true });
    })();
  </script>
</body>
</html>
